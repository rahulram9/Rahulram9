
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHULRAM9</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#081426;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:480px;margin:25px auto}
.card{
 background:#11233d;padding:22px;border-radius:18px;
 border:1px solid #c9a44c;margin-bottom:18px;
}
h1,h2{color:#e6bd63;text-align:center}
.logo{text-align:center;color:#e6bd63;font-size:27px;font-weight:bold}
input,button{
 width:100%;padding:13px;margin:8px 0;
 border-radius:9px;border:1px solid #53647c;
 font-size:16px;
}
input{background:#fff;color:#111}
button{
 background:#d5ad56;color:#101b2b;
 font-weight:bold;border:0;cursor:pointer;
}
button.secondary{background:#263b59;color:white}
.small{color:#b9c5d5;font-size:13px;text-align:center}
#dashboard{display:none}
#authMessage,#profileMessage{
 text-align:center;color:#e6bd63;word-break:break-word
}
.avatar{
 width:120px;height:120px;border-radius:50%;
 object-fit:cover;border:3px solid #d5ad56;
 display:block;margin:15px auto;background:#263b59;
}
label{display:block;margin-top:12px;color:#e6bd63}
hr{border:0;border-top:1px solid #53647c;margin:22px 0}
</style>
</head>
<body>
<div class="container">
<div class="logo">RAHULRAM9</div>
<p class="small">YOUR DIGITAL WORLD</p>

<div id="authBox" class="card">
<h2>Welcome</h2>

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter password">

<label>Full Name (Signup के लिए)</label>
<input id="fullName" type="text" placeholder="Enter full name">

<label>Phone Number (Signup के लिए)</label>
<input id="phone" type="tel" placeholder="Enter phone number">

<button onclick="signup()">Create Account</button>
<button class="secondary" onclick="login()">Login</button>
<p id="authMessage"></p>
</div>

<div id="dashboard" class="card">
<h2>My Dashboard</h2>

<img id="avatar"
 class="avatar"
 src="https://placehold.co/120x120?text=Photo"
 alt="Profile Photo">

<label>Choose Profile Photo</label>
<input id="photoFile" type="file" accept="image/*">
<button onclick="uploadPhoto()">Upload Photo</button>

<hr>
<h2>Edit Profile</h2>

<label>Full Name</label>
<input id="editName" type="text">

<label>Email</label>
<input id="userEmail" type="email" disabled>

<label>Phone Number</label>
<input id="editPhone" type="tel">

<label>User ID</label>
<input id="userId" type="text" disabled>

<button onclick="saveProfile()">Save Profile</button>

<hr>
<h2>Change Password</h2>

<label>Current Password</label>
<input id="currentPassword" type="password"
 placeholder="Enter current password">

<label>New Password</label>
<input id="newPassword" type="password"
 placeholder="Enter new password">

<label>Confirm New Password</label>
<input id="confirmPassword" type="password"
 placeholder="Confirm new password">

<button onclick="changePassword()">Update Password</button>

<hr>
<button class="secondary" onclick="logout()">Logout</button>
<p id="profileMessage"></p>
</div>
</div>

<script>
const SUPABASE_URL =
"https://phimnowliepfntltiacu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9yn-gBZyDYkGlRTWRrLHEg_1WGv6jeh";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;

function message(id,text){
 document.getElementById(id).textContent=text;
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("fullName").value.trim();
 const phone=document.getElementById("phone").value.trim();

 if(!email||!password||!name){
  message("authMessage","Email, Password और Name भरें।");
  return;
 }

 message("authMessage","Account बनाया जा रहा है...");

 const {data,error}=await supabaseClient.auth.signUp({
  email,
  password,
  options:{data:{full_name:name,phone:phone}}
 });

 if(error){
  message("authMessage",error.message);
  return;
 }

 if(data.session){
  await loadProfile(data.user);
 }else{
  message("authMessage",
  "Account बन गया। Email confirmation करें, फिर Login करें।");
 }
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  message("authMessage","Email और Password भरें।");
  return;
 }

 message("authMessage","Login हो रहा है...");

 const {data,error}=await supabaseClient.auth.signInWithPassword({
  email,password
 });

 if(error){
  message("authMessage",error.message);
  return;
 }

 await loadProfile(data.user);
}

async function loadProfile(user){
 currentUser=user;

 let {data:profile,error}=await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(error){
  message("authMessage","Profile error: "+error.message);
  return;
 }

 if(!profile){
  const {data:newProfile,error:insertError}=await supabaseClient
   .from("profiles")
   .insert({
    id:user.id,
    full_name:user.user_metadata?.full_name || "",
    phone:user.user_metadata?.phone || "",
    updated_at:new Date().toISOString()
   })
   .select()
   .single();

  if(insertError){
   message("authMessage","Profile error: "+insertError.message);
   return;
  }
  profile=newProfile;
 }

 document.getElementById("authBox").style.display="none";
 document.getElementById("dashboard").style.display="block";

 document.getElementById("editName").value=profile.full_name||"";
 document.getElementById("editPhone").value=profile.phone||"";
 document.getElementById("userEmail").value=user.email||"";
 document.getElementById("userId").value=user.id;

 document.getElementById("avatar").src=
  profile.avatar_url ||
  "https://placehold.co/120x120?text=Photo";

 message("profileMessage","Profile loaded successfully!");
}

async function saveProfile(){
 if(!currentUser)return;

 const name=document.getElementById("editName").value.trim();
 const phone=document.getElementById("editPhone").value.trim();

 if(!name){
  message("profileMessage","Full Name भरें।");
  return;
 }

 message("profileMessage","Saving...");

 const {error}=await supabaseClient
  .from("profiles")
  .update({
   full_name:name,
   phone:phone,
   updated_at:new Date().toISOString()
  })
  .eq("id",currentUser.id);

 if(error){
  message("profileMessage","Error: "+error.message);
  return;
 }

 const {error:metadataError}=await supabaseClient.auth.updateUser({
  data:{full_name:name,phone:phone}
 });

 if(metadataError){
  message("profileMessage",
   "Profile saved, but account details sync error: "+metadataError.message);
  return;
 }

 message("profileMessage","Profile updated successfully!");
}

async function changePassword(){
 if(!currentUser)return;

 const oldPassword=document.getElementById("currentPassword").value;
 const newPassword=document.getElementById("newPassword").value;
 const confirmPassword=document.getElementById("confirmPassword").value;

 if(!oldPassword||!newPassword||!confirmPassword){
  message("profileMessage","तीनों Password भरें।");
  return;
 }

 if(newPassword.length<8){
  message("profileMessage","नया Password कम से कम 8 अक्षर का रखें।");
  return;
 }

 if(newPassword!==confirmPassword){
  message("profileMessage","नया Password और Confirm Password एक जैसे नहीं हैं।");
  return;
 }

 if(oldPassword===newPassword){
  message("profileMessage","नया Password पुराने से अलग रखें।");
  return;
 }

 message("profileMessage","Password verify हो रहा है...");

 const {error:loginError}=await supabaseClient.auth.signInWithPassword({
  email:currentUser.email,
  password:oldPassword
 });

 if(loginError){
  message("profileMessage","Current Password गलत है।");
  return;
 }

 const {error:updateError}=await supabaseClient.auth.updateUser({
  password:newPassword
 });

 if(updateError){
  message("profileMessage","Password error: "+updateError.message);
  return;
 }

 document.getElementById("currentPassword").value="";
 document.getElementById("newPassword").value="";
 document.getElementById("confirmPassword").value="";

 message("profileMessage","Password successfully changed!");
}

async function uploadPhoto(){
 if(!currentUser)return;

 const file=document.getElementById("photoFile").files[0];

 if(!file){
  message("profileMessage","पहले Gallery से फोटो चुनें।");
  return;
 }

 if(!file.type.startsWith("image/")){
  message("profileMessage","सिर्फ Image File चुनें।");
  return;
 }

 if(file.size>5*1024*1024){
  message("profileMessage","फोटो 5 MB से छोटी रखें।");
  return;
 }

 message("profileMessage","Photo upload हो रही है...");

 const extension=file.name.split(".").pop().toLowerCase();
 const filePath=currentUser.id+"/"+Date.now()+"."+extension;

 const {error:uploadError}=await supabaseClient.storage
  .from("avatars")
  .upload(filePath,file,{
   upsert:true,
   contentType:file.type
  });

 if(uploadError){
  message("profileMessage","Upload error: "+uploadError.message);
  return;
 }

 const {data}=supabaseClient.storage
  .from("avatars")
  .getPublicUrl(filePath);

 const photoUrl=data.publicUrl;

 const {error:profileError}=await supabaseClient
  .from("profiles")
  .update({
   avatar_url:photoUrl,
   updated_at:new Date().toISOString()
  })
  .eq("id",currentUser.id);

 if(profileError){
  message("profileMessage","Profile error: "+profileError.message);
  return;
 }

 document.getElementById("avatar").src=photoUrl;
 document.getElementById("photoFile").value="";

 message("profileMessage","Profile Photo successfully uploaded!");
}

async function logout(){
 await supabaseClient.auth.signOut();
 currentUser=null;

 document.getElementById("dashboard").style.display="none";
 document.getElementById("authBox").style.display="block";

 message("authMessage","आप Logout हो गए हैं।");
}

async function checkLogin(){
 const {data}=await supabaseClient.auth.getSession();

 if(data.session){
  await loadProfile(data.session.user);
 }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  document.getElementById("dashboard").style.display="none";
  document.getElementById("authBox").style.display="block";
 }
});

checkLogin();
</script>
</body>
</html>
